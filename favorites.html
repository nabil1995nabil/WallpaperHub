<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#f7f9fc">
<title>المفضلة | WallpaperHub</title>

<link rel="stylesheet" href="favorites.css">
<link rel="stylesheet" href="effects.css">
<link rel="stylesheet" href="ai-fab.css">
<link rel="stylesheet" href="bottom-nav.css">
<link rel="stylesheet" href="css/theme.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
<header class="header">
    <button class="back-btn" type="button" onclick="history.back()" aria-label="رجوع">
        <span class="material-icons">arrow_forward</span>
    </button>

    <div class="header-title">
        <div class="title-line">
            <h1>المفضلة</h1>
            <span id="favoritesCountBadge" class="count-badge">0</span>
        </div>
        <p>كل الخلفيات التي اخترتها في مكان واحد</p>
    </div>

    <button id="randomBtn" class="header-tool" type="button" aria-label="خلفية عشوائية">
        <span class="material-icons">shuffle</span>
    </button>
</header>

<main class="favorites-container">

    <section class="hero-card">
        <div class="hero-icon"><span class="material-icons">favorite</span></div>
        <div class="hero-copy">
            <strong>مجموعتك الشخصية</strong>
            <span id="heroSummary">جارٍ تحميل المفضلة...</span>
        </div>
        <button id="selectModeBtn" class="hero-action" type="button">
            <span class="material-icons">checklist</span>
            تحديد
        </button>
    </section>

    <section class="tools-panel" aria-label="أدوات المفضلة">
        <label class="search-box">
            <span class="material-icons">search</span>
            <input id="favoriteSearch" type="search" autocomplete="off"
                   placeholder="ابحث داخل المفضلة..." aria-label="البحث داخل المفضلة">
            <button id="clearSearchBtn" type="button" aria-label="مسح البحث">
                <span class="material-icons">close</span>
            </button>
        </label>

        <div class="tool-row">
            <div class="sort-wrap">
                <span class="material-icons">sort</span>
                <select id="sortSelect" aria-label="ترتيب المفضلة">
                    <option value="newest">الأحدث إضافة</option>
                    <option value="oldest">الأقدم إضافة</option>
                    <option value="name">الاسم أبجدياً</option>
                    <option value="popular">الأكثر شعبية</option>
                </select>
            </div>

            <div class="view-tools">
                <button class="view-btn active" data-view="grid" type="button" aria-label="عرض شبكي">
                    <span class="material-icons">grid_view</span>
                </button>
                <button class="view-btn" data-view="compact" type="button" aria-label="عرض مضغوط">
                    <span class="material-icons">view_agenda</span>
                </button>
            </div>
        </div>

        <div class="quick-actions">
            <button id="exportBtn" type="button"><span class="material-icons">download</span>نسخ احتياطي</button>
            <button id="importBtn" type="button"><span class="material-icons">upload_file</span>استعادة</button>
            <button id="clearAllBtn" class="danger-tool" type="button"><span class="material-icons">delete_sweep</span>حذف الكل</button>
            <input id="importFile" type="file" accept="application/json,.json" hidden>
        </div>
    </section>

    <section id="selectionBar" class="selection-bar" hidden>
        <div>
            <strong id="selectedCount">0</strong>
            <span>محدد</span>
        </div>
        <div class="selection-actions">
            <button id="selectAllBtn" type="button"><span class="material-icons">select_all</span>الكل</button>
            <button id="removeSelectedBtn" class="danger-tool" type="button"><span class="material-icons">delete</span>إزالة</button>
            <button id="cancelSelectionBtn" type="button"><span class="material-icons">close</span>إلغاء</button>
        </div>
    </section>

    <div class="section-head">
        <div>
            <span class="eyebrow">YOUR COLLECTION</span>
            <h2 id="sectionTitle">الخلفيات المحفوظة</h2>
        </div>
        <span id="visibleCount" class="visible-count">0</span>
    </div>

    <section id="favoritesGrid" class="favorites-grid" aria-live="polite"></section>

    <section id="emptyState" class="empty-state" hidden>
        <div class="empty-art"><span class="material-icons">favorite_border</span></div>
        <h3 id="emptyTitle">لا توجد خلفيات مفضلة</h3>
        <p id="emptyText">احفظ أي خلفية تعجبك، وستجدها هنا جاهزة للعودة إليها في أي وقت.</p>
        <div class="empty-actions">
            <button id="exploreBtn" class="primary-btn" type="button">
                <span class="material-icons">explore</span>استكشف الخلفيات
            </button>
            <button id="emptyRandomBtn" class="secondary-btn" type="button">
                <span class="material-icons">shuffle</span>اكتشف عشوائياً
            </button>
        </div>
    </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="confirmModal" class="modal-backdrop" hidden>
    <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <div class="confirm-icon"><span class="material-icons">warning</span></div>
        <h3 id="confirmTitle">تأكيد العملية</h3>
        <p id="confirmText">هل أنت متأكد؟</p>
        <div class="modal-actions">
            <button id="cancelModalBtn" class="secondary-btn" type="button">إلغاء</button>
            <button id="confirmModalBtn" class="danger-btn" type="button">تأكيد</button>
        </div>
    </div>
</div>

<div id="bottomNav"></div>

<script src="favorites.js"></script>
<script type="module" src="user-sync.js"></script>
<script src="effects.js"></script>
<script src="theme.js"></script>
<script src="ai-fab.js"></script>
<script src="js/components.js"></script>
<script src="bottom-nav-20d.js"></script>
</body>
</html>
