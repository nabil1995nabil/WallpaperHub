<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WallpaperHub AI</title>


<link rel="stylesheet" href="ai.css">


<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">


</head>


<body>


<div class="ai-bg"></div>


<div class="ai-page">


<!-- Sidebar -->

<div class="sidebar" id="sidebar">


<div class="sidebar-header">

<button id="closeSidebar">
✕
</button>

<h3>
المحادثات
</h3>

</div>


<button class="new-chat" id="newChat">

+ محادثة جديدة

</button>



<div id="chatHistory">

</div>


</div>




<!-- Main -->

<div class="chat-main">


<div class="top-bar">

<button id="menuBtn" class="menu-btn">
☰
</button>


<div class="ai-brand">

WallpaperHub AI

</div>


</div>



<div class="chat-container" id="chatContainer">


</div>



<div class="chat-input">

...

</div>



</div>


</div>



<!-- الشعار فقط -->

<div class="ai-brand">


<canvas id="aiCanvas" width="50" height="50"></canvas>


<span>
WallpaperHub AI
</span>


</div>





<!-- منطقة المحادثة -->


<div class="chat-container" id="chatContainer">


<!-- تظهر الرسائل هنا -->



<div class="welcome-screen">

<h1 id="welcomeText">
سلام عليكم
</h1>

</div>



</div>






<!-- صندوق الكتابة -->


<div class="chat-input">



<button 
id="imageBtn"
class="input-btn">

<span class="material-icons">
image
</span>

</button>


<input 
type="file"
id="imageInput"
accept="image/*"
hidden>





<input

type="text"

id="userInput"

placeholder="اكتب رسالتك..."

autocomplete="off"

>





<button 
id="sendBtn"
class="send-btn">


<span class="material-icons">
send
</span>


</button>



</div>




</div>





<script src="ai-fab.js"></script>

<script type="module" src="ai.js"></script>


</body>

</html>
