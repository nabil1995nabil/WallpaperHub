<!DOCTYPE html>

<html lang="ar" dir="rtl">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>WallpaperHub</title>


<!-- ملفات الستايل الحالية مع دعم تصميم الشريط الضوئي الجديد -->

<link rel="stylesheet" href="home_step1.css">

<link rel="stylesheet" href="css/slider.css">

<link rel="stylesheet" href="css/home-categories.css">

<link rel="stylesheet" href="effects.css">

<link rel="stylesheet" href="ai-fab.css">

<link rel="stylesheet" href="css/theme.css">

<link rel="stylesheet" href="css/ai-button.css">

<link rel="stylesheet" href="css/notification-button.css">

<link rel="stylesheet" href="css/bottom-nav.css">

<link rel="stylesheet" href="sidebar.css">

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>


<body>


<!--أعدي الوصفة -->

<div id="sidebar-container"></div>


<!-- ================= HEADER (المصمم حديثاً خطوة بخطوة) ================= -->

<header class="header">

    <div class="header-left">

        <button id="menuBtn" class="menu-btn">

            <span></span>

            <span></span>

            <span></span>

        </button>

        <div class="logo">

            <div class="logo-icon-wrapper">

                <span class="material-icons">خلفية</span>

            </div>

            <div class="logo-text">

                <h2>WallpaperHub</h2>

                <span class="logo-subtitle">أكثر من مجرد خلفيات</span>

            </div>

        </div>

    </div>


    <div class="header-right">

        <div class="header-icon-btn" id="themeToggleBtn" title="الوضع الليلي">

            <span class="material-icons">dark_mode</span>

        </div>

        <div class="header-icon-btn notification-wrapper" id="notificationBtnHeader" onclick="openNotifications()" title="الإشعارات">

            <span class="material-icons">الإشعارات</span>

            <span class="notification-badge" id="notificationCount">3</span>

        </div>

        <div class="user-profile-badge" onclick="location.href='profile.html'">

            <div class="user-avatar">N</div>

            <div class="user-info">

                <span class="user-name">نابيل</span>

                <span class="user-role">مستكشف الجمال</span>

            </div>

        </div>

    </div>

</header>


<!-- خلفية اليوم -->

<section class="today-wallpaper">

    <img id="todayImage" alt=" توقيت اليوم">

    <div class="today-overlay">

        <span class="today-badge">⭐ خلفية اليوم</span>

        <h2 id="todayTitle"></h2>

        <p id="todayDescription"></p>

        <div class="today-buttons">

            <button id="todayView">👁 مشاهدة</button>

            <button id="todayDownload">⬇ تحميل</button>

        </div>

    </div>

</section>


<!-- Slider (ملفك الخارجي الأصلي) -->

<div class="slider-section">

    <div id="sliderContent"></div>

    <div class="mini-wrapper">

        <div class="mini-cards"></div>

    </div>

</div>


<!-- الفئات -->

<div id="homeCategories"></div>


<!-- الأكثر شعبية -->

<section class="wall-section">

    <div class="title">

        <h3>🔥الاكثر شعبية</h3>

        <a href="all-wallpapers.html?type=popular">عرض الكل</a>

    </div>

    <div class="wall-grid" id="popularWallpapers"></div>

</section>


<!-- أحدث الخلفيات -->

<section class="wall-section">

    <div class="title">

        <h3>🆕أحدث الخلفيات</h3>

        <a href="all-wallpapers.html?type=latest">عرض الكل</a>

    </div>

    <div class="wall-grid" id="latestWallpapers"></div>

</section>


<!-- الأكثر تحميلاً -->

<section class="wall-section">

    <div class="title">

        <h3>📥الاكثر تحميلا</h3>

        <a href="all-wallpapers.html?type=downloaded">عرض الكل</a>

    </div>

    <div class="wall-grid" id="downloadedWallpapers"></div>

</section>


<!-- الأكثر إعجاباً -->

<section class="wall-section">

    <div class="title">

        <h3>❤️ الأكثر إعجاباً</h3>

        <a href="all-wallpapers.html?type=liked">عرض الكل</a>

    </div>

    <div class="wall-grid" id="likedWallpapers"></div>

</section>


<!-- ولك -->

<section class="wall-section">

    <div class="title">

        <h3>⭐ توجيهاتك</h3>

        <a href="all-wallpapers.html?type=recommending">عرض الكل</a>

    </div>

    <div class="wall-grid" id="recommendedWallpapers"></div>

</section>


<section class="wall-section wallhaven-section">

    <div class="title">

        <h3>🌐 Wallhaven AI</h3>

        <a href="#">عرض الكل</a>

    </div>

    <div id="wallhavenAI" class="wall-grid"></div>

</section>


<!--الخيار -->

<section class="categories-section">

    <div class="title">

        <h3>📂 </h3>

        <a href="categories.html">عرض الكل</a>

    </div>

    <div id="categoriesContainer" class="categories-grid"></div>

</section>


<!-- فئات ديناميكية -->

<div id="dynamicSections"></div>


<!-- التنقل السفلي (ملفك الخارجي الأصلي) -->

<div id="bottomNav"></div>


<script src="js/components.js"></script>

<script src="js/bottom-nav-20d.js"></script>

<script src="js/slider.js"></script>

<script src="js/performance-engine.js"></script>

<script type="module" src="home.js"></script>

<script src="theme.js"></script>

<script src="effects.js"></script>

<script src="ai-fab.js"></script>

<script src="sidebar.js"></script>

</body>

</html>
