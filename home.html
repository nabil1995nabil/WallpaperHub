<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>WallpaperHub</title>

<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="css/slider.css">
<link rel="stylesheet" href="css/home-categories.css">
<link rel="stylesheet" href="effects.css">
<link rel="stylesheet" href="ai-fab.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/ai-button.css">
<link rel="stylesheet" href="css/notification-button.css">
<link rel="stylesheet" href="css/bottom-nav.css">
<link rel="stylesheet" href="sidebar.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>

<body>

<!-- قائمة جانبية-->

<div id="sidebar-container"></div>

<!-- Compact Premium Header — Reference Match -->
<header class="header premium-header">

    <div class="reference-brand">
        <button id="menuBtn" class="menu-btn reference-menu" aria-label="القائمة">
            <span></span><span></span><span></span>
        </button>

        <div class="reference-logo">
            <div class="reference-w-mark" aria-hidden="true">
                <i></i><i></i><i></i>
            </div>
            <div class="reference-brand-text">
                <div class="reference-brand-name">
                    <span>Wallpaper</span><b>Hub</b>
                </div>
                <small>أكثر من مجرد خلفيات</small>
            </div>
        </div>
    </div>

    <label class="reference-search">
        <span class="material-icons">search</span>
        <input id="homeSearch" type="search"
               placeholder="ابحث عن خلفياتك المفضلة..."
               autocomplete="off">
    </label>

    <div class="reference-actions">

        <button class="reference-icon-btn theme-toggle"
                id="headerThemeBtn"
                aria-label="تغيير المظهر">
            <span class="material-icons">dark_mode</span>
        </button>

        <div class="reference-notification" id="notificationButton"></div>

        <button class="reference-profile" id="profileChip" aria-label="الحساب">
            <span class="reference-avatar">N</span>
            <span class="reference-profile-copy">
                <strong>NABIL</strong>
                <small>مستكشف الجمال</small>
            </span>
            <span class="material-icons reference-chevron">expand_more</span>
        </button>

        <div id="aiButton" class="header-ai-wrap"></div>
    </div>

</header>

<!-- Wallpaper Of The Day -->

<section class="today-wallpaper">

<img id="todayImage">

<div class="today-overlay">

<span class="today-badge">
⭐ خلفية اليوم
</span>

<h2 id="todayTitle"></h2>

<p id="todayDescription"></p>

<div class="today-actions">

<button id="todayView">
👁 مشاهدة
</button>

<button id="todayDownload">
⬇ تحميل
</button>

</div>

</section>

<!-- Slider -->

<div class="slider-section">

    <div id="sliderContent"></div>

    <div class="mini-wrapper">

        <div class="mini-cards"></div>

    </div>


</div>

<!-- CATEGORIES -->

<div id="homeCategories"></div>

<!-- الأكثر شعبية -->

<section class="wall-section">

<div class="title">

<h3>🔥 الأكثر شعبية</h3>

<a href="all-wallpapers.html?type=popular">
    عرض الكل
</a>

</div>

<div class="wall-grid" id="popularWallpapers"></div>

</section>

<!-- أحدث الخلفيات -->

<section class="wall-section">

    <div class="title">

        <h3>🆕 أحدث الخلفيات</h3>

<a href="all-wallpapers.html?type=latest">
    عرض الكل
</a>

    </div>

    <div class="wall-grid" id="latestWallpapers"></div>

</section>

<!-- الأكثر تحميلاً -->

<section class="wall-section">

    <div class="title">

<h3>📥 الأكثر تحميلاً</h3>

<a href="all-wallpapers.html?type=downloaded">
    عرض الكل
</a>

    </div>

    <div class="wall-grid" id="downloadedWallpapers"></div>

</section>

<!-- الأكثر إعجاباً -->

<section class="wall-section">

    <div class="title">

<h3>❤️ الأكثر إعجاباً</h3>

<a href="all-wallpapers.html?type=liked">
    عرض الكل
</a>

    </div>

    <div class="wall-grid" id="likedWallpapers"></div>

</section>

<!-- المقترحة لك -->

<section class="wall-section">

    <div class="title">

<h3>⭐ المقترحة لك</h3>

<a href="all-wallpapers.html?type=recommended">
    عرض الكل
</a>

    </div>

    <div class="wall-grid" id="recommendedWallpapers"></div>

</section>

<section class="wall-section wallhaven-section">

<div class="title">

<h3>🌐 Wallhaven AI</h3>

<a href="#">عرض الكل</a>

</div>


<div id="wallhavenAI" class="wall-grid"></div>


</section>

<!-- الأقسام -->

<section class="categories-section">

    <div class="title">

<h3>📂 الأقسام</h3>

<a href="categories.html">
   عرض الكل
</a>

    </div>

    <div id="categoriesContainer" class="categories-grid"></div>

</section>

<!-- Dynamic Categories -->
<div id="dynamicSections"></div>


<!-- Bottom Navigation -->

<div id="bottomNav"></div>


<script src="js/components.js"></script>
<script src="js/bottom-nav-20d.js"></script>
<script src="js/slider.js"></script>
<script src="js/performance-engine.js"></script>
<script type="module" src="home.js"></script>
<script src="theme.js"></script>
<script src="effects.js"></script>
<script src="ai-fab.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
