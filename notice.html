<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الإشعارات</title>

<link rel="stylesheet" href="notice.css">

</head>


<body>


<div class="notifications-wrapper">



<!-- HEADER -->

<header class="notif-header">


<div class="header-top">


<div class="title-area">


<h1>

الإشعارات

<span 
class="badge-count"
id="unread-count">

0

</span>


</h1>


</div>



<div class="header-actions">


<button 
class="icon-btn"
id="mark-all-btn">

✓✓

</button>



<button 
class="icon-btn">

⚙️

</button>



</div>


</div>





<!-- FILTERS -->


<nav class="notif-tabs">


<button 
class="tab-btn active"
data-filter="all">

الكل

</button>



<button 
class="tab-btn"
data-filter="mention">

الإشارات (@)

</button>



<button 
class="tab-btn"
data-filter="like">

الإعجابات

</button>



<button 
class="tab-btn"
data-filter="admin">

الإعلانات

</button>



</nav>



</header>







<!-- NOTIFICATIONS FROM SERVER -->


<main 
class="notif-feed"
id="notificationsFeed">



</main>





</div>





<script src="notice.js"></script>


</body>

</html>
