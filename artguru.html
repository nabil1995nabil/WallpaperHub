<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Artguru AI Enhancer
</title>


<link rel="stylesheet" href="artguru.css">


</head>


<body>


<header>

<div class="logo">
⚡ Artguru Studio
</div>


<button class="ai-btn">
✨ تحسين بالذكاء الاصطناعي
</button>


</header>




<div class="container">



<!-- قسم الرفع -->

<div class="main-card">


<h2>
طور صورك إلى دقة خارقة
</h2>



<p class="description">

ارفع صورتك الآن لتفعيل ميزات المعالجة الذكية عبر Artguru API

</p>




<div class="upload-zone">



<input
type="file"
id="imageInput"
accept="image/*"
hidden
>




<div class="camera-icon">

📸

</div>



<p>

اسحب الصورة هنا أو اضغط لتصفح الملفات

</p>




<img
id="previewImage"
alt="Preview"
>



</div>




<br>



<button
id="enhanceBtn"
class="ai-btn"
>

✨ تحسين بالذكاء الاصطناعي

</button>



</div>







<!-- معرض النتائج -->


<h3 class="gallery-title">

مستودع الصور المرفوعة والمحسنة

</h3>




<div class="gallery-grid">



<!-- النتيجة -->

<div class="gallery-item">


<img
id="resultImage"
src=""
alt="Enhanced Result"
>



<div class="download-overlay">


<button
id="downloadBtn"
class="download-btn"
>

⬇️ تحميل النسخة المحسنة

</button>



</div>


</div>






</div>




</div>






<script src="artguru.js"></script>


</body>


</html>
