<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>الأقسام | WallpaperHub</title>

    <link rel="stylesheet" href="categories.css">
    <link rel="stylesheet" href="effects.css">
    <link rel="stylesheet" href="css/theme.css">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body class="categories-page-body">

<header class="header">
    <button class="back-btn" type="button" onclick="history.back()" aria-label="رجوع">
        <span class="material-icons">arrow_back</span>
    </button>

    <div class="header-content">
        <h1>الأقسام</h1>
        <p>اكتشف أقسام الخلفيات المفضلة لديك</p>
    </div>

    <div class="header-badge" aria-hidden="true">
        <span class="material-icons">layers</span>
        <span>
            <strong>خلفيات مميزة</strong>
            <small>جميع الأقسام</small>
        </span>
    </div>
</header>

<main class="categories-page">

    <button class="category-card" type="button" data-category="all" data-image="all.svg">
        <span class="category-media"><span class="category-image" aria-hidden="true"></span>
            <span class="category-icon"><span class="material-icons">public</span></span>
            <span class="category-arrow material-icons">chevron_left</span>
        </span>
        <span class="category-content">
            <strong>الكل</strong>
            <small>عرض جميع الخلفيات</small>
        </span>
    </button>

    <button class="category-card" type="button" data-category="nature" data-image="nature.svg">
        <span class="category-media"><span class="category-image" aria-hidden="true"></span>
            <span class="category-icon"><span class="material-icons">eco</span></span>
            <span class="category-arrow material-icons">chevron_left</span>
        </span>
        <span class="category-content">
            <strong>الطبيعة</strong>
            <small>جبال وغابات وأنهار</small>
        </span>
    </button>

    <button class="category-card" type="button" data-category="cars" data-image="cars.svg">
        <span class="category-media"><span class="category-image" aria-hidden="true"></span>
            <span class="category-icon"><span class="material-icons">directions_car</span></span>
            <span class="category-arrow material-icons">chevron_left</span>
        </span>
        <span class="category-content">
            <strong>السيارات</strong>
            <small>سيارات رياضية وفاخرة</small>
        </span>
    </button>

    <button class="category-card" type="button" data-category="games" data-image="games.svg">
        <span class="category-media"><span class="category-image" aria-hidden="true"></span>
            <span class="category-icon"><span class="material-icons">sports_esports</span></span>
            <span class="category-arrow material-icons">chevron_left</span>
        </span>
        <span class="category-content">
            <strong>الألعاب</strong>
            <small>أفضل خلفيات الألعاب</small>
        </span>
    </button>

    <button class="category-card" type="button" data-category="space" data-image="space.svg">
        <span class="category-media"><span class="category-image" aria-hidden="true"></span>
            <span class="category-icon"><span class="material-icons">public</span></span>
            <span class="category-arrow material-icons">chevron_left</span>
        </span>
        <span class="category-content">
            <strong>الفضاء</strong>
            <small>نجوم ومجرات وكواكب</small>
        </span>
    </button>

    <button class="category-card" type="button" data-category="ai" data-image="ai.svg">
        <span class="category-media"><span class="category-image" aria-hidden="true"></span>
            <span class="category-icon"><span class="material-icons">smart_toy</span></span>
            <span class="category-arrow material-icons">chevron_left</span>
        </span>
        <span class="category-content">
            <strong>الذكاء الاصطناعي</strong>
            <small>خلفيات AI</small>
        </span>
    </button>

    <button class="category-card" type="button" data-category="amoled" data-image="amoled.svg">
        <span class="category-media"><span class="category-image" aria-hidden="true"></span>
            <span class="category-icon"><span class="material-icons">smartphone</span></span>
            <span class="category-arrow material-icons">chevron_left</span>
        </span>
        <span class="category-content">
            <strong>AMOLED</strong>
            <small>خلفيات سوداء</small>
        </span>
    </button>

    <button class="category-card" type="button" data-category="animals" data-image="animals.svg">
        <span class="category-media"><span class="category-image" aria-hidden="true"></span>
            <span class="category-icon"><span class="material-icons">pets</span></span>
            <span class="category-arrow material-icons">chevron_left</span>
        </span>
        <span class="category-content">
            <strong>الحيوانات</strong>
            <small>قطط وطيور وحيوانات</small>
        </span>
    </button>

    <button class="category-card" type="button" data-category="anime" data-image="anime.svg">
        <span class="category-media"><span class="category-image" aria-hidden="true"></span>
            <span class="category-icon"><span class="material-icons">face</span></span>
            <span class="category-arrow material-icons">chevron_left</span>
        </span>
        <span class="category-content">
            <strong>الأنمي</strong>
            <small>شخصيات الأنمي</small>
        </span>
    </button>

    <button class="category-card" type="button" data-category="city" data-image="city.svg">
        <span class="category-media"><span class="category-image" aria-hidden="true"></span>
            <span class="category-icon"><span class="material-icons">location_city</span></span>
            <span class="category-arrow material-icons">chevron_left</span>
        </span>
        <span class="category-content">
            <strong>المدن</strong>
            <small>مدن ومناظر حضرية</small>
        </span>
    </button>

    <button class="category-card" type="button" data-category="dark" data-image="dark.svg">
        <span class="category-media"><span class="category-image" aria-hidden="true"></span>
            <span class="category-icon"><span class="material-icons">dark_mode</span></span>
            <span class="category-arrow material-icons">chevron_left</span>
        </span>
        <span class="category-content">
            <strong>Dark</strong>
            <small>خلفيات داكنة AMOLED</small>
        </span>
    </button>

    <button class="category-card" type="button" data-category="4k" data-image="4k.svg">
        <span class="category-media"><span class="category-image" aria-hidden="true"></span>
            <span class="category-icon"><span class="material-icons">diamond</span></span>
            <span class="category-arrow material-icons">chevron_left</span>
        </span>
        <span class="category-content">
            <strong>4K</strong>
            <small>جودة عالية جداً</small>
        </span>
    </button>

    <button class="category-card" type="button" data-category="sports" data-image="sports.svg">
        <span class="category-media"><span class="category-image" aria-hidden="true"></span>
            <span class="category-icon"><span class="material-icons">sports_soccer</span></span>
            <span class="category-arrow material-icons">chevron_left</span>
        </span>
        <span class="category-content">
            <strong>الرياضة</strong>
            <small>كرة القدم والرياضات</small>
        </span>
    </button>

    <button class="category-card" type="button" data-category="minimal" data-image="minimal.svg">
        <span class="category-media"><span class="category-image" aria-hidden="true"></span>
            <span class="category-icon"><span class="material-icons">auto_awesome</span></span>
            <span class="category-arrow material-icons">chevron_left</span>
        </span>
        <span class="category-content">
            <strong>Minimal</strong>
            <small>تصاميم بسيطة وأنيقة</small>
        </span>
    </button>

</main>

<script src="js/components.js"></script>
<script src="categories.js"></script>
<script src="theme.js"></script>

</body>
</html>
