<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>الأقسام | WallpaperHub</title>
<link rel="stylesheet" href="categories.css">
<link rel="stylesheet" href="bottom-nav.css">
<link rel="stylesheet" href="effects.css">
<link rel="stylesheet" href="css/theme.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body class="categories-page-body">

<header class="header">
    <button class="back-btn" type="button" onclick="history.back()" aria-label="رجوع">
        <span class="material-icons">arrow_forward</span>
    </button>

    <div class="header-content">
        <span class="eyebrow"><span class="material-icons">collections</span> WALLPAPERHUB</span>
        <h1>الأقسام</h1>
        <p>اكتشف الخلفيات حسب ذوقك</p>
    </div>

    <button class="header-action" id="randomCategoryBtn" type="button" aria-label="قسم عشوائي">
        <span class="material-icons">shuffle</span>
    </button>
</header>

<main class="categories-page">

    <section class="explore-panel" aria-label="أدوات استكشاف الأقسام">
        <label class="search-box">
            <span class="material-icons">search</span>
            <input id="categorySearch" type="search" autocomplete="off"
                   placeholder="ابحث عن قسم: سيارات، أنمي، فضاء..." aria-label="البحث عن قسم">
            <button id="clearSearch" type="button" aria-label="مسح البحث">
                <span class="material-icons">close</span>
            </button>
        </label>

        <div class="quick-filters" aria-label="فلاتر سريعة">
            <button class="quick-filter active" type="button" data-route="all">
                <span class="material-icons">apps</span> كل الأقسام
            </button>
            <button class="quick-filter" type="button" data-route="latest">
                <span class="material-icons">schedule</span> الأحدث
            </button>
            <button class="quick-filter" type="button" data-route="popular">
                <span class="material-icons">local_fire_department</span> الأكثر شعبية
            </button>
            <button class="quick-filter" type="button" data-route="downloaded">
                <span class="material-icons">download</span> الأكثر تحميلاً
            </button>
            <button class="quick-filter" type="button" data-route="liked">
                <span class="material-icons">favorite</span> الأكثر إعجاباً
            </button>
            <button class="quick-filter" type="button" data-route="recommended">
                <span class="material-icons">auto_awesome</span> موصى بها
            </button>
            <button class="quick-filter" type="button" data-category-filter="4k">
                <span class="material-icons">diamond</span> 4K
            </button>
            <button class="quick-filter" type="button" data-category-filter="amoled">
                <span class="material-icons">dark_mode</span> AMOLED
            </button>
        </div>

        <div class="explore-meta">
            <div><strong id="resultsCount">14</strong><span>قسماً متاحاً</span></div>
            <button id="favoritesOnlyBtn" class="mini-tool" type="button">
                <span class="material-icons">star_border</span> المفضلة
            </button>
            <button id="resetFiltersBtn" class="mini-tool hidden" type="button">
                <span class="material-icons">restart_alt</span> إعادة الضبط
            </button>
        </div>
    </section>

    <section class="last-visited" id="lastVisited" hidden>
        <div class="last-icon"><span class="material-icons">history</span></div>
        <div><small>آخر قسم زرته</small><strong id="lastVisitedName">—</strong></div>
        <button id="continueLastBtn" type="button">متابعة <span class="material-icons">chevron_left</span></button>
    </section>

    <div class="section-heading">
        <div><span>CATALOG</span><h2>كل الأقسام</h2></div>
        <i></i>
    </div>

    <section class="categories-grid" id="categoriesGrid" aria-label="أقسام الخلفيات">

        <button class="category-card" type="button" data-category="all" data-image="all.svg" data-search="الكل جميع الخلفيات">
            <span class="category-media"><span class="category-image"></span><span class="category-icon"><span class="material-icons">public</span></span><span class="category-arrow material-icons">chevron_left</span></span>
            <span class="category-content"><strong>الكل</strong><small>عرض جميع الخلفيات</small><span class="favorite-toggle"><span class="material-icons">star_border</span></span></span>
        </button>

        <button class="category-card" type="button" data-category="nature" data-image="nature.svg" data-search="الطبيعة جبال غابات أنهار">
            <span class="category-media"><span class="category-image"></span><span class="category-icon"><span class="material-icons">eco</span></span><span class="category-arrow material-icons">chevron_left</span></span>
            <span class="category-content"><strong>الطبيعة</strong><small>جبال وغابات وأنهار</small><span class="favorite-toggle"><span class="material-icons">star_border</span></span></span>
        </button>

        <button class="category-card" type="button" data-category="cars" data-image="cars.svg" data-search="السيارات سيارات رياضية فاخرة">
            <span class="category-media"><span class="category-image"></span><span class="category-icon"><span class="material-icons">directions_car</span></span><span class="category-arrow material-icons">chevron_left</span></span>
            <span class="category-content"><strong>السيارات</strong><small>سيارات رياضية وفاخرة</small><span class="favorite-toggle"><span class="material-icons">star_border</span></span></span>
        </button>

        <button class="category-card" type="button" data-category="games" data-image="games.svg" data-search="الألعاب ألعاب gaming">
            <span class="category-media"><span class="category-image"></span><span class="category-icon"><span class="material-icons">sports_esports</span></span><span class="category-arrow material-icons">chevron_left</span></span>
            <span class="category-content"><strong>الألعاب</strong><small>أفضل خلفيات الألعاب</small><span class="favorite-toggle"><span class="material-icons">star_border</span></span></span>
        </button>

        <button class="category-card" type="button" data-category="space" data-image="space.svg" data-search="الفضاء نجوم مجرات كواكب">
            <span class="category-media"><span class="category-image"></span><span class="category-icon"><span class="material-icons">public</span></span><span class="category-arrow material-icons">chevron_left</span></span>
            <span class="category-content"><strong>الفضاء</strong><small>نجوم ومجرات وكواكب</small><span class="favorite-toggle"><span class="material-icons">star_border</span></span></span>
        </button>

        <button class="category-card" type="button" data-category="ai" data-image="ai.svg" data-search="الذكاء الاصطناعي ai">
            <span class="category-media"><span class="category-image"></span><span class="category-icon"><span class="material-icons">smart_toy</span></span><span class="category-arrow material-icons">chevron_left</span></span>
            <span class="category-content"><strong>الذكاء الاصطناعي</strong><small>خلفيات AI</small><span class="favorite-toggle"><span class="material-icons">star_border</span></span></span>
        </button>

        <button class="category-card" type="button" data-category="amoled" data-image="amoled.svg" data-search="amoled أسود oled">
            <span class="category-media"><span class="category-image"></span><span class="category-icon"><span class="material-icons">smartphone</span></span><span class="category-arrow material-icons">chevron_left</span></span>
            <span class="category-content"><strong>AMOLED</strong><small>خلفيات سوداء</small><span class="favorite-toggle"><span class="material-icons">star_border</span></span></span>
        </button>

        <button class="category-card" type="button" data-category="animals" data-image="animals.svg" data-search="الحيوانات قطط طيور">
            <span class="category-media"><span class="category-image"></span><span class="category-icon"><span class="material-icons">pets</span></span><span class="category-arrow material-icons">chevron_left</span></span>
            <span class="category-content"><strong>الحيوانات</strong><small>قطط وطيور وحيوانات</small><span class="favorite-toggle"><span class="material-icons">star_border</span></span></span>
        </button>

        <button class="category-card" type="button" data-category="anime" data-image="anime.svg" data-search="الأنمي anime شخصيات">
            <span class="category-media"><span class="category-image"></span><span class="category-icon"><span class="material-icons">face</span></span><span class="category-arrow material-icons">chevron_left</span></span>
            <span class="category-content"><strong>الأنمي</strong><small>شخصيات الأنمي</small><span class="favorite-toggle"><span class="material-icons">star_border</span></span></span>
        </button>

        <button class="category-card" type="button" data-category="city" data-image="city.svg" data-search="المدن مدينة city urban">
            <span class="category-media"><span class="category-image"></span><span class="category-icon"><span class="material-icons">location_city</span></span><span class="category-arrow material-icons">chevron_left</span></span>
            <span class="category-content"><strong>المدن</strong><small>مدن ومناظر حضرية</small><span class="favorite-toggle"><span class="material-icons">star_border</span></span></span>
        </button>

        <button class="category-card" type="button" data-category="dark" data-image="dark.svg" data-search="dark داكن مظلم أسود">
            <span class="category-media"><span class="category-image"></span><span class="category-icon"><span class="material-icons">dark_mode</span></span><span class="category-arrow material-icons">chevron_left</span></span>
            <span class="category-content"><strong>Dark</strong><small>خلفيات داكنة AMOLED</small><span class="favorite-toggle"><span class="material-icons">star_border</span></span></span>
        </button>

        <button class="category-card" type="button" data-category="4k" data-image="4k.svg" data-search="4k جودة عالية ultra hd">
            <span class="category-media"><span class="category-image"></span><span class="category-icon"><span class="material-icons">diamond</span></span><span class="category-arrow material-icons">chevron_left</span></span>
            <span class="category-content"><strong>4K</strong><small>جودة عالية جداً</small><span class="favorite-toggle"><span class="material-icons">star_border</span></span></span>
        </button>

        <button class="category-card" type="button" data-category="sports" data-image="sports.svg" data-search="الرياضة كرة القدم sports">
            <span class="category-media"><span class="category-image"></span><span class="category-icon"><span class="material-icons">sports_soccer</span></span><span class="category-arrow material-icons">chevron_left</span></span>
            <span class="category-content"><strong>الرياضة</strong><small>كرة القدم والرياضات</small><span class="favorite-toggle"><span class="material-icons">star_border</span></span></span>
        </button>

        <button class="category-card" type="button" data-category="minimal" data-image="minimal.svg" data-search="minimal بسيط هادئ">
            <span class="category-media"><span class="category-image"></span><span class="category-icon"><span class="material-icons">auto_awesome</span></span><span class="category-arrow material-icons">chevron_left</span></span>
            <span class="category-content"><strong>Minimal</strong><small>تصاميم بسيطة وأنيقة</small><span class="favorite-toggle"><span class="material-icons">star_border</span></span></span>
        </button>
    </section>

    <section id="noResults" class="no-results" hidden>
        <span class="material-icons">search_off</span>
        <strong>لم نجد هذا القسم</strong>
        <p>جرّب كلمة أخرى مثل «طبيعة» أو «أنمي» أو «4K».</p>
        <button id="showAllBtn" type="button">عرض كل الأقسام</button>
    </section>
</main>

<script src="js/components.js"></script>
<script src="categories.js"></script>
<script src="bottom-nav.js"></script>
<script src="theme.js"></script>
</body>
</html>
