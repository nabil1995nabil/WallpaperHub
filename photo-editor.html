<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>محرر الصور | WallpaperHub</title><link rel="stylesheet" href="photo-editor-new.css"></head><body><div class="app"><header><a class="logo" href="index.html"><b>W</b>Wallpaper<span>Hub</span></a><div class="head"><button id="undo" disabled>↶</button><button id="redo" disabled>↷</button><button id="reset">إعادة ضبط</button><button class="download" id="download">⬇ تحميل الصورة</button></div></header><main><section class="work"><div class="bar"><button id="minus">−</button><strong id="zoom">100%</strong><button id="plus">+</button><button id="fit">ملاءمة</button><button id="full">⛶</button></div><div class="stage" id="stage"><div class="empty" id="empty"><div>🖼️</div><h1>ابدأ بتعديل صورتك</h1><p>ارفع صورة ثم عدّلها بالطريقة التي تريدها.</p><button class="primary" id="pick">＋ اختيار صورة</button><small>JPG · PNG · WEBP</small></div><canvas id="canvas" hidden></canvas></div><footer><span id="info">لم يتم اختيار صورة</span><span>جاهز</span></footer></section><aside id="side"><div class="mobile-head"><b>أدوات التعديل</b><button id="close">×</button></div><input id="file" type="file" accept="image/*" hidden><button class="upload" id="upload">＋ رفع صورة جديدة</button><nav><button class="tab active" data-p="adjust">☀️<small>ضبط</small></button><button class="tab" data-p="filter">🎨<small>فلاتر</small></button><button class="tab" data-p="transform">✂️<small>تحويل</small></button><button class="tab" data-p="draw">✏️<small>رسم</small></button><button class="tab" data-p="text">T<small>نص</small></button><button class="tab" data-p="effects">✨<small>تأثيرات</small></button></nav><div class="panels"><section class="panel active" id="p-adjust"><h2>الضبط الأساسي</h2><div id="adjusts"></div></section><section class="panel" id="p-filter"><h2>فلاتر جاهزة</h2><div class="filters" id="filters"></div></section><section class="panel" id="p-transform"><h2>القص والتحويل</h2><div class="grid4"><button data-act="rl">↺<small>يسار</small></button><button data-act="rr">↻<small>يمين</small></button><button data-act="fh">↔<small>قلب أفقي</small></button><button data-act="fv">↕<small>قلب عمودي</small></button></div><h3>نسبة القص</h3><div class="ratios" id="ratios"></div><button class="wide" id="crop">✂️ تطبيق القص</button><h3>تغيير الحجم</h3><div class="size"><input id="width" type="number" placeholder="العرض"><b>×</b><input id="height" type="number" placeholder="الارتفاع"></div><button class="wide secondary" id="resize">تغيير الحجم</button></section><section class="panel" id="p-draw"><h2>الرسم على الصورة</h2><div class="drawm"><button class="active" data-draw="brush">🖌️ فرشاة</button><button data-draw="eraser">⌫ ممحاة</button></div><label>اللون <input id="drawColor" type="color" value="#ffffff"></label><label>حجم الفرشاة <b id="brushV">12</b><input id="brush" type="range" min="1" max="100" value="12"></label><label>الشفافية <b id="brushOpacityV">100</b><input id="brushOpacity" type="range" min="10" max="100" value="100"></label></section><section class="panel" id="p-text"><h2>إضافة نص</h2><textarea id="text" placeholder="اكتب النص هنا..."></textarea><div class="two"><select id="font"><option>Arial</option><option>Tahoma</option><option>Georgia</option><option>Courier New</option></select><input id="fontSize" type="number" value="56" min="8" max="400"></div><div class="texttools"><input id="textColor" type="color" value="#ffffff"><button id="bold">B</button><button id="italic">I</button></div><button class="wide" id="addText">＋ إضافة النص</button></section><section class="panel" id="p-effects"><h2>تأثيرات إضافية</h2><div id="effects"></div><div class="effectbuttons"><button data-effect="poster">Posterize</button><button data-effect="duo">Duotone</button><button data-effect="soft">Soft</button></div></section></div></aside></main><button class="mobile-tools" id="open">⚙️ أدوات التعديل</button><div id="toast"></div></div><script src="photo-editor-new.js"></script></body></html>
