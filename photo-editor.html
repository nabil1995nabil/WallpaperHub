<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>محرر الصور والفيديو | WallpaperHub</title>
<link rel="stylesheet" href="photo-editor.css">
</head>
<body>
<div class="editor-app">
  <header class="editor-header">
    <button id="cancelEdit" class="header-btn cancel-btn" type="button">إلغاء</button>
    <div class="header-center">
      <strong>تحرير</strong>
      <span id="info">لم يتم اختيار ملف</span>
    </div>
    <div class="header-actions">
      <button id="download" class="header-btn save-btn" type="button">حفظ</button>
      <button id="pickTop" class="header-plus" type="button" aria-label="اختيار صورة أو فيديو">+</button>
      <button id="qualityBtn" class="quality-btn" type="button">الجودة <span>⌄</span></button>
    </div>
  </header>

  <main class="editor-main">
    <section class="media-area">
      <div class="stage" id="stage">
        <canvas id="canvas" hidden></canvas>
        <div class="empty-stage" id="emptyStage">
          <button id="pickEmpty" class="empty-plus" type="button" aria-label="اختيار صورة أو فيديو">+</button>
          <span>اختر صورة أو فيديو للبدء</span>
        </div>
      </div>

      <div class="media-tools">
        <div class="zoom-tools">
          <button id="fit" type="button">ملاءمة</button>
          <button id="minus" type="button">−</button>
          <strong id="zoom">100%</strong>
          <button id="plus" type="button">+</button>
        </div>
        <div class="history-row">
          <button id="undo" class="history-btn" disabled aria-label="تراجع">↶</button>
          <button id="redo" class="history-btn" disabled aria-label="إعادة">↷</button>
        </div>
      </div>
    </section>

    <section class="control-panel" id="inlineControls" aria-label="أدوات التحرير">
      <div class="control-header">
        <div>
          <span id="inlineKicker">تعديل</span>
          <strong id="inlineTitle">السطوع</strong>
        </div>
        <output id="inlineValue">0</output>
      </div>
      <div class="inline-options" id="inlineOptions"></div>
      <div class="slider-row" id="inlineSliderWrap">
        <input id="inlineSlider" type="range" min="-100" max="100" value="0" aria-label="قيمة التعديل">
      </div>
      <div class="inline-actions" id="inlineActions"></div>
    </section>

    <div class="status-row">
      <span id="statusText">جاهز للتحرير</span>
      <span id="sizeInfo">—</span>
    </div>

    <nav class="editor-toolbar" id="bottomTools" aria-label="أدوات التحرير">
      <button class="tool active" data-tool="adjust"><i>☷</i><span>تعديل</span></button>
      <button class="tool" data-tool="filters"><i>◉</i><span>فلاتر</span></button>
      <button class="tool" data-tool="transform"><i>⌗</i><span>قص</span></button>
      <button class="tool" data-tool="draw"><i>⌑</i><span>رسم</span></button>
      <button class="tool" data-tool="text"><i>T</i><span>نص</span></button>
      <button class="tool" data-tool="stickers"><i>✦</i><span>ملصق</span></button>
      <button class="tool" data-tool="frame"><i>▣</i><span>إطار</span></button>
      <button class="tool" data-tool="blur"><i>◌</i><span>تمويه</span></button>
    </nav>

    <div class="mode-tabs">
      <button class="mode-tab active">أساسية</button>
      <button class="mode-tab">إنشاء</button>
    </div>

    <input id="file" type="file" accept="image/*,video/*" hidden>
    <input id="videoFiles" type="file" accept="video/*" multiple hidden>
    <video id="videoSource" playsinline preload="metadata" hidden></video>
    
    <!-- Hidden engine controls: functional inputs only, no legacy editor UI. -->
    <div id="engineControls" hidden aria-hidden="true">
      <div id="adjusts"></div>
      <div id="filters"></div><div id="ratios"></div>
      <div id="textTemplates"></div><div id="textTemplates2"></div>
      <div id="swatches"></div>
      <input id="blur" type="range" min="0" max="24" value="0"><b id="blurV">0</b>
      <input id="edge" type="range" min="0" max="100" value="0"><b id="edgeV">0</b>
      <input id="frame" type="range" min="0" max="100" value="0"><b id="frameV">0</b>
      <input id="brush" type="range" min="1" max="160" value="12"><b id="brushV">12</b>
      <input id="brushOpacity" type="range" min="5" max="100" value="100"><b id="brushOpacityV">100</b>
      <input id="drawColor" type="color" value="#ffffff">
      <input id="text" type="text"><input id="fontSize" type="number" value="56">
      <select id="font"><option>Arial</option><option>Tahoma</option><option>Georgia</option></select>
      <input id="textColor" type="color" value="#ffffff">
      <button id="bold"></button><button id="italic"></button><button id="textShadow"></button><button id="textStroke"></button>
      <input id="shadowBlur" type="range" min="0" max="30" value="8">
      <input id="strokeWidth" type="range" min="0" max="20" value="0">
      <button id="addText"></button><button id="crop"></button>
      <input id="width" type="number"><input id="height" type="number"><button id="resize"></button>
      <button id="reset"></button><button id="full"></button>
      <div id="effects"></div>
      <div id="lightControls"></div>
      <div id="stickers"></div>
    </div>

          <section class="video-deck" id="videoDeck" aria-hidden="true">
        <div class="video-deck-head">
          <div class="video-project">
            <span class="video-live"></span>
            <b>VIDEO STUDIO</b>
            <small id="videoProjectInfo">مشروع فيديو</small>
          </div>
          <div class="video-head-actions">
            <button id="videoUndoTrim">↶</button>
            <button id="videoAddClip">＋ إضافة مقطع</button>
            <button id="videoClose">×</button>
          </div>
        </div>

        <div class="video-transport">
          <button class="video-play" id="videoPlay">▶</button>
          <span id="videoCurrent">00:00</span>
          <div class="video-scrub" id="videoScrub">
            <div class="video-scrub-fill" id="videoScrubFill"></div>
            <div class="video-playhead" id="videoPlayhead"></div>
          </div>
          <span id="videoDuration">00:00</span>
          <button id="videoMute">🔊</button>
        </div>

        <div class="video-timeline-wrap">
          <div class="video-ruler" id="videoRuler"></div>
          <div class="video-timeline" id="videoTimeline">
            <div class="video-clips" id="videoClips"></div>
            <div class="trim-window" id="trimWindow">
              <button class="trim-handle trim-left" id="trimLeft" aria-label="بداية القص"></button>
              <button class="trim-handle trim-right" id="trimRight" aria-label="نهاية القص"></button>
            </div>
          </div>
        </div>

        <div class="video-controls-grid">
          <div class="video-control-card">
            <span>السرعة</span>
            <div class="video-chips" id="speedChips">
              <button data-speed="0.5">0.5×</button>
              <button data-speed="0.75">0.75×</button>
              <button class="active" data-speed="1">1×</button>
              <button data-speed="1.25">1.25×</button>
              <button data-speed="1.5">1.5×</button>
              <button data-speed="2">2×</button>
            </div>
          </div>
          <div class="video-control-card">
            <span>قص المقطع الحالي</span>
            <div class="video-trim-values">
              <b id="trimStartValue">00:00</b>
              <b id="trimEndValue">00:00</b>
            </div>
            <div class="dual-range">
              <input id="trimStart" type="range" min="0" max="1000" value="0">
              <input id="trimEnd" type="range" min="0" max="1000" value="1000">
            </div>
          </div>
          <div class="video-control-card">
            <span>الصوت</span>
            <input id="videoVolume" type="range" min="0" max="100" value="100">
            <small id="videoVolumeValue">100%</small>
          </div>
        </div>

        <div class="video-quick-tools">
          <button id="videoSplit">✂ تقسيم عند المؤشر</button>
          <button id="videoDuplicate">⧉ تكرار المقطع</button>
          <button id="videoDelete">⌫ حذف المقطع</button>
          <button id="videoResetTrim">↺ إلغاء القص</button>
          <button id="videoExport" class="video-export">⬇ تصدير الفيديو WebM</button>
        </div>
      </section>

  </main>
  <div id="toast" role="status"></div>
</div>
<script src="photo-editor.js"></script>
</body>
</html>
