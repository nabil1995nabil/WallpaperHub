<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>نقاطي | WallpaperHub</title>
  <link rel="stylesheet" href="points.css">
  <link rel="stylesheet" href="css/theme.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <header class="points-header">
    <button id="pointsBackBtn" type="button" aria-label="الرجوع"><span class="material-icons">arrow_forward</span></button>
    <h1>نقاطي</h1>
    <span class="header-spacer"></span>
  </header>
  <main class="points-main">
    <section class="points-balance-card" aria-label="رصيد النقاط">
      <span class="material-icons balance-icon">paid</span>
      <p>رصيد نقاطك</p>
      <strong id="pointsTotal">—</strong>
      <span class="balance-caption">النقاط المسجلة في حسابك</span>
    </section>
    <section class="points-section">
      <div class="section-heading"><h2>سجل النقاط</h2><span class="material-icons">history</span></div>
      <p id="pointsStatus" class="points-status" role="status">جاري تحميل النقاط…</p>
      <div id="pointsLedger" class="points-ledger"></div>
    </section>
    <p class="points-note">تُحتسب النقاط من الخادم بعد التحقق من العملية. نظام المكافآت الإضافية سيظهر هنا عند تفعيله.</p>
  </main>
  <script type="module" src="points.js"></script>
</body>
</html>
