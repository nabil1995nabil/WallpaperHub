<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f8ff">
<meta name="description" content="WallpaperHub — عالم من الخلفيات المميزة">
<title>WallpaperHub</title>
<link rel="stylesheet" href="splash.css">
<link rel="stylesheet" href="css/theme.css">
</head>

<body>
<main class="splash" aria-label="WallpaperHub">

    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="ambient ambient-three"></div>

    <section class="brand-card">
        <div class="logo-orbit" aria-hidden="true">
            <span class="orbit-dot dot-one"></span>
            <span class="orbit-dot dot-two"></span>
            <span class="orbit-dot dot-three"></span>
        </div>

        <div class="brand-logo" aria-label="شعار WallpaperHub">
            <img src="wallpaperhub-w-logo.svg" alt="WallpaperHub">
        </div>

        <div class="brand-copy">
            <div class="eyebrow">
                <span class="eyebrow-line"></span>
                <span>YOUR WALLPAPER SPACE</span>
                <span class="eyebrow-line"></span>
            </div>

            <h1 id="title">WallpaperHub</h1>

            <p class="tagline">
                خلفيات تليق بشاشتك
            </p>

            <p class="subtagline">
                اكتشف، احفظ، وشارك أجمل الخلفيات في مكان واحد.
            </p>
        </div>

        <div class="loading-area" aria-label="جاري التحميل">
            <div class="loading-track">
                <span id="loadingBar"></span>
            </div>
            <div class="loading-meta">
                <span id="loadingText">نجهّز عالمك...</span>
                <span id="loadingPercent">0%</span>
            </div>
        </div>

        <div class="feature-pills" aria-hidden="true">
            <span><b>✦</b> HD</span>
            <span><b>✦</b> 4K</span>
            <span><b>✦</b> AMOLED</span>
            <span><b>✦</b> مفضلة</span>
        </div>
    </section>

    <footer class="splash-footer">
        <span>WallpaperHub</span>
        <i></i>
        <span>Premium Wallpapers</span>
    </footer>

</main>

<script src="splash.js"></script>
<script src="js/performance-engine.js"></script>
<script src="theme.js"></script>
</body>
</html>
